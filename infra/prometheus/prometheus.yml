global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # dns_sd descubre todas las réplicas (docker compose --scale api=N)
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
